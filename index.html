<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/images/alka-traders-logo-400.png" />
    <link rel="apple-touch-icon" href="/images/alka-traders-logo-400.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-friendly site summary" />
    <link rel="alternate" type="text/plain" href="/llms-full.txt" title="Full site content for LLMs" />

    <title>Marine Spare Parts &amp; Ship Spares Supplier | Alka Traders</title>
    <meta name="description" content="Global supplier of marine spares, ship machinery, surplus equipment, hydraulics, pneumatics, electrical automation, and emergency procurement parts from Bhavnagar, Gujarat, India." />
    <meta name="theme-color" content="#0c2d48" />

    <!-- The build-time prerenderer injects a crawlable SEO shell inside #root.
         Hide it only when JavaScript is active (html.js) so it never flashes
         before React mounts, while no-JS visitors still get real content.
         The app-loading spinner is the visible pre-React state in the raw
         Vite shell and is wiped by React on mount. -->
    <style>
      html.js #root .seo-shell { display: none; }
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f4ef;
      }
      .app-loading::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 121, 107, 0.2);
        border-top-color: #00796b;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      html.dark .app-loading { background: #111816; }
      html.dark .app-loading::after {
        border-color: rgba(93, 213, 191, 0.2);
        border-top-color: #5dd5bf;
      }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Apply the saved theme before first paint to avoid a light-mode flash.
         Falls back to the VITE_DEFAULT_THEME env var ("dark" or "light").
         %VITE_DEFAULT_THEME% is replaced by Vite at build time. -->
    <script>
      (function () {
        // Enables CSS that hides the prerendered SEO shell once JavaScript is
        // available. Without JS the shell stays visible and readable.
        document.documentElement.classList.add('js')
        try {
          var t = localStorage.getItem('alka-theme')
          if (t !== 'dark' && t !== 'light') {
            t = '%VITE_DEFAULT_THEME%' === 'dark' ? 'dark' : 'light'
          }
          if (t === 'dark') {
            document.documentElement.classList.remove('light')
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.add('light')
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {}
      })()
    </script>
    <meta name="author" content="Alka Traders" />
    <meta name="generator" content="Alka Traders Platform" />
    <meta name="google-site-verification" content="google793bfc62e0bcf7cb" />

    <!-- Page-specific robots, canonical, and social metadata are emitted by
         the prerendered document or the React SEO component. -->

    <!-- Open Graph (homepage defaults for the raw Vite shell) -->
    <meta property="og:title" content="Marine Spare Parts &amp; Ship Spares Supplier | Alka Traders" />
    <meta property="og:description" content="Global supplier of marine spares, ship machinery, surplus equipment, hydraulics, pneumatics, electrical automation, and emergency procurement parts from Bhavnagar, Gujarat, India." />
    <meta property="og:url" content="https://alkatraders.co/en/" />
    <meta property="og:site_name" content="Alka Traders" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://alkatraders.co/images/alka-traders-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Alka Traders marine and industrial equipment supplier" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marine Spare Parts &amp; Ship Spares Supplier | Alka Traders" />
    <meta name="twitter:description" content="Global supplier of marine spares, ship machinery, surplus equipment, hydraulics, pneumatics, electrical automation, and emergency procurement parts." />
    <meta name="twitter:image" content="https://alkatraders.co/images/alka-traders-logo.png" />
    <meta name="twitter:image:alt" content="Alka Traders marine and industrial equipment supplier" />



    <!-- Page-specific Organization, WebSite, breadcrumb, and Product JSON-LD
         are emitted by the prerender step and the React SEO component. A
         second template copy would duplicate the graph on every page. -->

    <!-- Preconnect to critical origins. Fonts are self-hosted (/fonts/fonts.css,
         roadmap D34), so no third-party font origins are needed. -->
    <link rel="preconnect" href="https://api.alkatraders.co" />
    <!-- Fire the product-detail API call now (only does anything on
         /product/<id> deep links) so it overlaps the JS download instead of
         starting after hydration — see public/early-product.js. async so it
         never blocks parsing. -->
    <script async src="/early-product.js"></script>
    <!-- NOTE: the navbar logo is intentionally NOT preloaded. Preloading a
         1024×1024 image gave it the same priority as the page's actual
         content images, so hero/product photos waited behind it on every
         page. It is fetched normally by the navbar <img>. -->
    <!-- NOTE: the generic placeholder (used only as an on-demand fallback for
         products with no image) is intentionally NOT preloaded — it wasted a
         request and triggered "preloaded but not used" warnings on every page. -->

    <!-- Self-hosted fonts (roadmap D34): one same-origin stylesheet + four
         variable-font woff2 files (latin subset). No third-party request can
         fail for any visitor — ad blockers and HTTPS-filtering antivirus no
         longer matter — and @font-face font-display: swap keeps text painting
         immediately in the fallback face. Same-origin + HTTP/2 makes the old
         preload-as-style trick unnecessary. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />


  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-label="Loading"></div>
    </div>
    <noscript>
      <style>.app-loading { display: none !important; }</style>
      <p>Alka Traders supplies marine spares, ship machinery, and industrial equipment. <a href="/en/products/">Browse the product catalog</a> or <a href="/en/contact/">contact us</a>.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
