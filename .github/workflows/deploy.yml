name: Build + Deploy to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Backend ─────────────────────────────────────────────────
  # Builds the backend (prisma generate + tsc) so Railway gets a compiled
  # dist/ on deploy. Railway also runs `npm run build` itself on its side,
  # but running it here catches build failures before Railway tries to deploy.
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────
  # Builds the Vite SPA + prerenders + sitemap + copies to frontend/dist.
  # This is what the `web` Railway service serves via server.js.
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (root)
        # Blocking. A type regression must not ship: CI runs the same check, and
        # a green check that cannot fail is worse than no check at all.
        run: npx tsc -b --noEmit

      - name: Unit tests (root)
        # Root tests only — the backend suite needs backend node_modules and
        # runs in the backend job / CI.
        run: npm run test

      - name: Build frontend
        # The deployable web artifact is the SPA plus prerendered routes,
        # sitemap and the frontend/dist copy — not just Vite's output.
        run: npm run build:frontend:full

  # ─── Deploy to Railway ───────────────────────────────────────
  # Triggers a Railway redeploy via the project's deploy hook URL.
  # Railway watches the GitHub repo and auto-deploys on push by default,
  # but this step gives an explicit signal and a place to add rollback / tag
  # logic later.
  #
  # SETUP: In Railway, go to Project Settings → Deploy Hooks and copy the URL.
  # Add it as a repository variable named RAILWAY_DEPLOY_HOOK_URL.
  deploy:
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Railway deploy
        if: ${{ vars.RAILWAY_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST -d '{}' "${{ vars.RAILWAY_DEPLOY_HOOK_URL }}"
