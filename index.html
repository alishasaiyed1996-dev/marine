<!doctype html>

    <meta charset="UTF-8" />

    <!-- Preload the two fonts that paint above the fold (hero H1 = Manrope,
         body/UI = DM Sans). The @font-face rules are inlined below, so the
         woff2 downloads start in parallel with the document instead of after
         a render-blocking fonts.css request — that stylesheet was flagged by
         Lighthouse, and the font swap it delayed was the CLS culprit: the
         Manrope hero headline reflowed when the real face arrived. -->
    <link rel="preload" href="/fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google tag (gtag.js) — GA4 measurement ID G-2556Z1FEES.
         Present in the head of every page: the prerendered documents and the
         server-rendered product/hub pages all inherit this head from this
         build template, and the CSP allows this inline bootstrap through the
         sha256 hash server.js computes from this file at startup.

         Consent-gated. The tag is declared with type="text/plain", so the
         browser neither fetches nor runs it, and the bootstrap below promotes
         it to a live tag only after the visitor accepts cookies. The gate reads
         the same alka-cookie-consent key as src/lib/consent.ts, so the cookie
         banner and the privacy policy keep their promise that analytics does
         not run before consent.

         `send_page_view: false` because the storefront is a client-rendered
         app: StoreAnalytics fires every page view, including SPA navigations. -->
    <script
      id="alka-ga4-static"
      async
      type="text/plain"
      src="https://www.googletagmanager.com/gtag/js?id=G-2556Z1FEES"
    ></script>
    <script>
      (function () {
        var GA_ID = 'G-2556Z1FEES'
        window.dataLayer = window.dataLayer || []
        function gtag() { window.dataLayer.push(arguments) }
        window.gtag = window.gtag || gtag
        // Lets the React analytics component know this document already carries
        // the tag, so it never injects a second one (Google: one tag per page).
        window.__alkaStaticGaId = GA_ID

        function consentGranted() {
          try {
            var raw = window.localStorage.getItem('alka-cookie-consent')
            return !!raw && JSON.parse(raw).accepted === true
          } catch (e) { return false }
        }

        // The reset-password URL carries a one-time token; it must never reach
        // Google through page_location.
        function excludedPath() {
          return /^\/(en\/|ar\/|es\/)?reset-password/i.test(window.location.pathname)
        }

        window.__alkaActivateGa = function () {
          if (!consentGranted() || excludedPath()) return
          if (window.__alkaGaActive) return
          window.__alkaGaActive = true
          var live = document.createElement('script')
          live.id = 'alka-ga4-live'
          live.async = true
          live.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID
          document.head.appendChild(live)
          gtag('js', new Date())
          gtag('config', GA_ID, { send_page_view: false })
        }

        window.__alkaActivateGa()
        window.addEventListener('alka:consent-change', function (event) {
          if (event && event.detail && event.detail.accepted) window.__alkaActivateGa()
        })
      })()
    </script>

    <!-- Google Tag Manager — container GTM-KDQM2BLS.
         Load only after analytics consent, matching the cookie notice and GA4
         behavior. The container shares dataLayer with the existing GA4 tag. -->
    <script>
      (function (w, d, s, l, i) {
        function consentGranted() {
          try {
            var raw = w.localStorage.getItem('alka-cookie-consent')
            return !!raw && JSON.parse(raw).accepted === true
          } catch (e) { return false }
        }
        function excludedPath() {
          return /^\/(en\/|ar\/|es\/)?reset-password/i.test(w.location.pathname)
        }
        w.__alkaActivateGtm = function () {
          if (!consentGranted() || excludedPath() || w.__alkaGtmActive) return
          w.__alkaGtmActive = true
          var layer = w[l] = w[l] || []
          layer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
          var firstScript = d.getElementsByTagName(s)[0]
          var script = d.createElement(s)
          script.async = true
          script.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + (l !== 'dataLayer' ? '&l=' + l : '')
          firstScript.parentNode.insertBefore(script, firstScript)
        }
        w.__alkaActivateGtm()
        w.addEventListener('alka:consent-change', function (event) {
          if (event && event.detail && event.detail.accepted) w.__alkaActivateGtm()
        })
      })(window, document, 'script', 'dataLayer', 'GTM-KDQM2BLS')
    </script>

    <!-- Microsoft Clarity — project ID z4a1z0jkj5.
         Like GA4, Clarity stays inert until the visitor accepts analytics
         cookies. Keep reset-password URLs out of session recordings because
         they contain a one-time token. -->
    <script>
      (function (w, d) {
        var clarityId = 'z4a1z0jkj5'
        function consentGranted() {
          try {
            var raw = w.localStorage.getItem('alka-cookie-consent')
            return !!raw && JSON.parse(raw).accepted === true
          } catch (e) { return false }
        }
        function excludedPath() {
          return /^\/(en\/|ar\/|es\/)?reset-password/i.test(w.location.pathname)
        }
        w.__alkaActivateClarity = function () {
          if (!consentGranted() || excludedPath() || w.__alkaClarityActive) return
          w.__alkaClarityActive = true
          ;(function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) }
            t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y)
          })(w, d, 'clarity', 'script', clarityId)
        }
        w.__alkaActivateClarity()
        w.addEventListener('alka:consent-change', function (event) {
          if (event && event.detail && event.detail.accepted) w.__alkaActivateClarity()
        })
      })(window, document)
    </script>

    <!-- The build-time prerenderer injects a crawlable SEO shell inside #root.
         Hide it only when JavaScript is active (html.js) so it never flashes
         before React mounts, while no-JS visitors still get real content.
         The app-loading spinner is the visible pre-React state in the raw
         Vite shell and is wiped by React on mount. -->
    <style>
      html.js #root .seo-shell { display: none; }
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f4ef;
      }
      .app-loading::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 121, 107, 0.2);
        border-top-color: #00796b;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      html.dark .app-loading { background: #111816; }
      html.dark .app-loading::after {
        border-color: rgba(93, 213, 191, 0.2);
        border-top-color: #5dd5bf;
      }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Apply the saved theme before first paint to avoid a light-mode flash.
         Falls back to the VITE_DEFAULT_THEME env var ("dark" or "light").
         %VITE_DEFAULT_THEME% is replaced by Vite at build time. -->
    <script>
      (function () {
        // Enables CSS that hides the prerendered SEO shell once JavaScript is
        // available. Without JS the shell stays visible and readable.
        document.documentElement.classList.add('js')
        try {
          var t = localStorage.getItem('alka-theme')
          if (t !== 'dark' && t !== 'light') {
            t = '%VITE_DEFAULT_THEME%' === 'dark' ? 'dark' : 'light'
          }
          if (t === 'dark') {
            document.documentElement.classList.remove('light')
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.add('light')
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {}
      })()
    </script>

    <!-- Page-specific Organization, WebSite, breadcrumb, and Product JSON-LD
         are emitted by the prerender step and the React SEO component. A
         second template copy would duplicate the graph on every page. -->

    <!-- Preconnect to critical origins. Fonts are self-hosted (inlined
         @font-face below), so no third-party font origins are needed. -->
    <link rel="preconnect" href="https://api.alkatraders.co" />
    <!-- Fire the product-detail API call now (only does anything on
         /product/<id> deep links) so it overlaps the JS download instead of
         starting after hydration — see public/early-product.js. async so it
         never blocks parsing. -->
    <script async src="/early-product.js"></script>
    <!-- NOTE: the navbar logo is intentionally NOT preloaded. Preloading a
         1024×1024 image gave it the same priority as the page's actual
         content images, so hero/product photos waited behind it on every
         page. It is fetched normally by the navbar <img>. -->
    <!-- NOTE: the generic placeholder (used only as an on-demand fallback for
         products with no image) is intentionally NOT preloaded — it wasted a
         request and triggered "preloaded but not used" warnings on every page. -->

    <!-- Self-hosted fonts (roadmap D34), now INLINED instead of
         /fonts/fonts.css: the separate stylesheet was a render-blocking
         request (Lighthouse render-blocking-insight, ~163ms wasted). Keeping
         the @font-face here means one fewer request and the font URLs are
         discovered with the document. No third-party request can fail for
         any visitor — ad blockers and HTTPS-filtering antivirus no longer
         matter — and font-display: swap keeps text painting immediately in
         the fallback face.

         If a family is ever changed, re-download the variable woff2:
           curl -A "<chrome UA>" "https://fonts.googleapis.com/css2?family=<Fam>:wght@<MIN>..<MAX>&display=swap"
         then grab the latin (U+0000-00FF) woff2 URL from the response and
         update BOTH the src below and the matching preload above. -->
    <style>
      /* Space Grotesk — headings/display. Variable weight 400-700. */
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/space-grotesk-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* DM Sans — UI/body. Variable weight 400-900. */
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url('/fonts/dm-sans-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Manrope — hero/display. Variable weight 400-800. */
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* JetBrains Mono — code/identifiers. Variable weight 400-500. */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Noto Sans Arabic — Arabic body/headings (the other four faces are
         latin-subset only, so Arabic previously fell through to whatever
         system font each phone had). Variable weight 100-900, Arabic subset,
         OFL license: https://fonts.google.com/noto/specimen/Noto+Sans+Arabic */
      @font-face {
        font-family: 'Noto Sans Arabic';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/noto-sans-arabic-var.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC7, U+10EC9-10EEE, U+10EF0-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1;
      }
    </style>


  </head>
