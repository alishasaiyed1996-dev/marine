name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the `engines.node` requirement in package.json — a build
          # that passes on 20 and fails on 22 (or the reverse) is not a signal.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript Check
        # The root tsconfig is a solution file (references only, no files of its
        # own), so `tsc --noEmit` was a check that could not fail. `-b` builds
        # the referenced projects and is what deploy blocks on.
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Root unit tests are pure Node (no backend node_modules required):
      # shared-manifest metadata contract + structured-data golden tests.
      - name: Unit Tests
        run: npm run test

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-at-least-32-characters-long-for-jwt-signing
      CSRF_SECRET: ci-test-csrf-secret-at-least-32-characters-long-for-csrf

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci --include=dev

      - name: TypeScript Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit Tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build
